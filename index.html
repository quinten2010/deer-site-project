<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Cervidae | Modern Deer Encyclopedia</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css'>
    <style>
        :root {
            --deep-green: #1a2e1a;
            --cream: #f9f7f2;
            --sage: #8da399;
            --text-main: #2c3e50;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.dark {
            --deep-green: #0a110a;
            --cream: #1a1a1a;
            --sage: #4a5a52;
            --text-main: #f9f7f2;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--cream);
            color: var(--text-main);
            transition: var(--transition);
            line-height: 1.6;
        }

        /* Navbar */
        nav {
            position: fixed; top: 0; width: 100%; padding: 1.5rem 5%;
            background: rgba(26, 46, 26, 0.95); color: white;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; backdrop-filter: blur(10px);
        }

        .nav-links a {
            color: white; text-decoration: none; margin-left: 2rem;
            font-weight: 500; transition: var(--transition);
        }

        .nav-links a:hover { color: var(--sage); }

        /* Hero Section */
        .hero {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1484406566174-9da000fda645?auto=format&fit=crop&w=1920&q=80') center/cover;
            color: white; text-align: center; padding: 0 20px;
        }

        .hero h1 { font-size: 4rem; margin-bottom: 1rem; opacity: 0; transform: translateY(30px); animation: fadeIn 1s forwards; }

        /* Gallery */
        .section { padding: 80px 10%; }
        .gallery-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px; margin-top: 40px;
        }

        .gallery-item {
            overflow: hidden; border-radius: 12px; position: relative;
            cursor: pointer; height: 300px;
        }

        .gallery-item img {
            width: 100%; height: 100%; object-fit: cover;
            transition: var(--transition);
        }

        .gallery-item:hover img { transform: scale(1.1); }

        /* Dark Mode Toggle */
        .toggle-btn { cursor: pointer; font-size: 1.5rem; }

        /* Cookie Banner */
        .cookie-banner {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            background: var(--deep-green); color: white; padding: 20px;
            border-radius: 8px; display: flex; justify-content: space-between;
            align-items: center; z-index: 2000; transform: translateY(150%);
            transition: var(--transition);
        }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

<nav>
    <div class='logo'>CERVIDAE</div>
    <div class='nav-links'>
        <a href='#gallery'>Gallery</a>
        <a href='#blog'>Blog</a>
        <a href='#contact'>Socials</a>
        <i class='fas fa-moon toggle-btn' onclick='toggleDarkMode()'></i>
    </div>
</nav>

<section class='hero'>
    <div>
        <h1>Majestic Wilderness</h1>
        <p>Exploring the elegant world of deer species across the globe.</p>
    </div>
</section>

<section id='gallery' class='section'>
    <h2>Species Gallery</h2>
    <input type='text' id='search' placeholder='Search species...' onkeyup='filterGallery()' 
           style='padding: 10px; margin: 20px 0; width: 100%; border-radius: 5px; border: 1px solid var(--sage);'>
    <div class='gallery-grid' id='gallery-grid'>
        <div class='gallery-item' data-name='Red Deer'><img src='https://images.unsplash.com/photo-1543946207-39bd91e70ca7?w=500' alt='Red Deer'></div>
        <div class='gallery-item' data-name='Fallow Deer'><img src='https://images.unsplash.com/photo-1518467166778-b88f373ffec7?w=500' alt='Fallow Deer'></div>
        <div class='gallery-item' data-name='Reindeer'><img src='https://images.unsplash.com/photo-1516281730419-ce0147997220?w=500' alt='Reindeer'></div>
    </div>
</section>

<div class='cookie-banner' id='cookieBanner'>
    <p>This site uses cookies to ensure the best experience.</p>
    <button onclick='acceptCookies()' style='padding: 8px 20px; border: none; cursor: pointer;'>Accept</button>
</div>

<script>
    function toggleDarkMode() {
        document.body.classList.toggle('dark');
    }

    function filterGallery() {
        let input = document.getElementById('search').value.toLowerCase();
        let items = document.querySelectorAll('.gallery-item');
        items.forEach(item => {
            let name = item.getAttribute('data-name').toLowerCase();
            item.style.display = name.includes(input) ? '' : 'none';
        });
    }

    function acceptCookies() {
        document.getElementById('cookieBanner').style.transform = 'translateY(150%)';
    }

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('cookieBanner').style.transform = 'translateY(0)';
        }, 2000);
    }
</script>
</body>
</html>
